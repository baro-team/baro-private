config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
    tcp_connect:
      prober: tcp
      timeout: 5s

nodeSelector:
  role: monitoring

releaseLabel: false

serviceMonitor:
  enabled: true
  scheme: http
  path: /probe
  defaults:
    labels:
      release: monitoring
    interval: 60s
    scrapeTimeout: 10s
    module: http_2xx
  targets:
    - name: public-gateway-health
      url: https://dev.barocloud.com/
      module: http_2xx
      labels:
        release: monitoring
        source: blackbox
        domain: gateway
        service: gateway-service
    - name: internal-gateway-prometheus
      url: https://internal-dev.barocloud.com/actuator/prometheus
      module: http_2xx
      labels:
        release: monitoring
        source: blackbox
        domain: gateway
        service: gateway-service
    - name: control-health
      url: https://control-metrics.dev.barocloud.com/actuator/health
      module: http_2xx
      labels:
        release: monitoring
        source: blackbox
        domain: telemetry
        service: control-service
    - name: dispatch-health
      url: https://dispatch-metrics.dev.barocloud.com/actuator/health
      module: http_2xx
      labels:
        release: monitoring
        source: blackbox
        domain: dispatch
        service: dispatch-service
    - name: kafka-tcp
      url: kafka.baro.internal:9092
      module: tcp_connect
      labels:
        release: monitoring
        source: blackbox
        domain: kafka
        service: kafka

prometheusRule:
  enabled: true
  additionalLabels:
    release: monitoring
  rules:
    - alert: BaroBlackboxProbeFailed
      expr: probe_success == 0
      for: 3m
      labels:
        source: service
        severity: critical
        domain: blackbox
      annotations:
        summary: "Blackbox probe failed"
        description: "Blackbox probe가 3분 이상 실패했습니다. target={{ $labels.instance }}, job={{ $labels.job }}"
