defaultRules:
  disabled:
    # K3s does not expose these control-plane components as standard scrape targets.
    KubeProxyDown: true
    KubeSchedulerDown: true
    KubeControllerManagerDown: true
    KubeEtcdDown: true

grafana:
  nodeSelector:
    role: monitoring
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-operated.monitoring.svc:9090
      access: proxy
      isDefault: true
      uid: prometheus
      jsonData:
        httpMethod: POST
        timeInterval: 30s
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
  service:
    type: NodePort
    nodePort: 30300
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: baro
          orgId: 1
          folder: Baro
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/baro
  dashboards:
    baro:
      aws-observability:
        json: |
          {
            "uid": "baro-aws-observability",
            "title": "Baro AWS Observability",
            "tags": ["baro", "aws", "dev"],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "1m",
            "time": {
              "from": "now-6h",
              "to": "now"
            },
            "templating": {
              "list": [
                {
                  "name": "datasource",
                  "type": "datasource",
                  "query": "prometheus",
                  "current": {
                    "text": "Prometheus",
                    "value": "prometheus"
                  }
                }
              ]
            },
            "panels": [
              {
                "id": 1,
                "type": "timeseries",
                "title": "ALB Target 5xx",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
                "targets": [
                  {"expr": "sum by (load_balancer) (aws_applicationelb_httpcode_target_5_xx_count_sum)", "legendFormat": "{{load_balancer}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "ALB Target Response Time",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
                "targets": [
                  {"expr": "avg by (load_balancer) (aws_applicationelb_target_response_time_average)", "legendFormat": "{{load_balancer}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "ECS CPU Utilization",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
                "targets": [
                  {"expr": "avg by (service_name) (aws_ecs_cpuutilization_average)", "legendFormat": "{{service_name}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}]}}, "overrides": []}
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "ECS Memory Utilization",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
                "targets": [
                  {"expr": "avg by (service_name) (aws_ecs_memory_utilization_average)", "legendFormat": "{{service_name}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 85}]}}, "overrides": []}
              },
              {
                "id": 5,
                "type": "timeseries",
                "title": "RDS CPU Utilization",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16},
                "targets": [
                  {"expr": "avg by (dbinstance_identifier) (aws_rds_cpuutilization_average)", "legendFormat": "{{dbinstance_identifier}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}]}}, "overrides": []}
              },
              {
                "id": 6,
                "type": "timeseries",
                "title": "RDS Free Storage",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16},
                "targets": [
                  {"expr": "avg by (dbinstance_identifier) (aws_rds_free_storage_space_average)", "legendFormat": "{{dbinstance_identifier}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "bytes", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 10737418240}]}}, "overrides": []}
              },
              {
                "id": 7,
                "type": "timeseries",
                "title": "RDS Connections",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16},
                "targets": [
                  {"expr": "avg by (dbinstance_identifier) (aws_rds_database_connections_average)", "legendFormat": "{{dbinstance_identifier}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}]}}, "overrides": []}
              },
              {
                "id": 8,
                "type": "timeseries",
                "title": "ElastiCache CPU Utilization",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 8, "x": 0, "y": 24},
                "targets": [
                  {"expr": "avg by (cache_cluster_id) (aws_elasticache_cpuutilization_average)", "legendFormat": "{{cache_cluster_id}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}]}}, "overrides": []}
              },
              {
                "id": 9,
                "type": "timeseries",
                "title": "ElastiCache Memory Usage",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 8, "x": 8, "y": 24},
                "targets": [
                  {"expr": "avg by (cache_cluster_id) (aws_elasticache_database_memory_usage_percentage_average)", "legendFormat": "{{cache_cluster_id}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 85}]}}, "overrides": []}
              },
              {
                "id": 10,
                "type": "timeseries",
                "title": "ElastiCache Evictions",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 8, "x": 16, "y": 24},
                "targets": [
                  {"expr": "sum by (cache_cluster_id) (aws_elasticache_evictions_sum)", "legendFormat": "{{cache_cluster_id}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}
              },
              {
                "id": 11,
                "type": "timeseries",
                "title": "EC2 CPU Utilization",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
                "targets": [
                  {"expr": "avg by (instance_id) (aws_ec2_cpuutilization_average)", "legendFormat": "{{instance_id}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 85}]}}, "overrides": []}
              },
              {
                "id": 12,
                "type": "timeseries",
                "title": "EC2 Status Check Failed",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
                "targets": [
                  {"expr": "max by (instance_id) (aws_ec2_status_check_failed_instance_maximum)", "legendFormat": "instance {{instance_id}}"},
                  {"expr": "max by (instance_id) (aws_ec2_status_check_failed_system_maximum)", "legendFormat": "system {{instance_id}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}
              },
              {
                "id": 13,
                "type": "timeseries",
                "title": "EC2 Filesystem Usage",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 40},
                "targets": [
                  {"expr": "100 * (1 - (node_filesystem_avail_bytes{job=\"baro-ec2-node-exporter\",fstype!~\"tmpfs|overlay|squashfs|ramfs|nsfs\",mountpoint!~\"/dev.*|/proc.*|/run.*|/sys.*\"} / node_filesystem_size_bytes{job=\"baro-ec2-node-exporter\",fstype!~\"tmpfs|overlay|squashfs|ramfs|nsfs\",mountpoint!~\"/dev.*|/proc.*|/run.*|/sys.*\"}))", "legendFormat": "{{ec2_role}} {{mountpoint}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 90}]}}, "overrides": []}
              },
              {
                "id": 14,
                "type": "stat",
                "title": "EC2 Node Exporter Up",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 40},
                "targets": [
                  {"expr": "up{job=\"baro-ec2-node-exporter\"}", "legendFormat": "{{ec2_role}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}
              }
            ]
          }
      onprem-observability:
        json: |
          {
            "uid": "baro-onprem-observability",
            "title": "Baro On-prem Observability",
            "tags": ["baro", "onprem", "k3s"],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "1m",
            "time": {
              "from": "now-6h",
              "to": "now"
            },
            "templating": {
              "list": [
                {
                  "name": "datasource",
                  "type": "datasource",
                  "query": "prometheus",
                  "current": {
                    "text": "Prometheus",
                    "value": "prometheus"
                  }
                }
              ]
            },
            "panels": [
              {
                "id": 1,
                "type": "stat",
                "title": "K3s Ready Nodes",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
                "targets": [
                  {"expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "legendFormat": "ready"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 3}]}}, "overrides": []}
              },
              {
                "id": 2,
                "type": "stat",
                "title": "Running Pods",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
                "targets": [
                  {"expr": "sum(kube_pod_status_phase{phase=\"Running\",namespace=~\"monitoring|database|airflow\"})", "legendFormat": "running"}
                ],
                "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
              },
              {
                "id": 3,
                "type": "stat",
                "title": "Pod Restarts Last 15m",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
                "targets": [
                  {"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"monitoring|database|airflow\"}[15m]))", "legendFormat": "restarts"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 3}]}}, "overrides": []}
              },
              {
                "id": 4,
                "type": "stat",
                "title": "Unavailable Pods",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
                "targets": [
                  {"expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\",namespace=~\"monitoring|database|airflow\"})", "legendFormat": "unavailable"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}
              },
              {
                "id": 5,
                "type": "timeseries",
                "title": "Node CPU Usage",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
                "targets": [
                  {"expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))", "legendFormat": "{{instance}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 90}]}}, "overrides": []}
              },
              {
                "id": 6,
                "type": "timeseries",
                "title": "Node Memory Usage",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
                "targets": [
                  {"expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))", "legendFormat": "{{instance}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 90}]}}, "overrides": []}
              },
              {
                "id": 7,
                "type": "timeseries",
                "title": "Root Filesystem Usage",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
                "targets": [
                  {"expr": "100 * (1 - (node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"}))", "legendFormat": "{{instance}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 90}]}}, "overrides": []}
              },
              {
                "id": 8,
                "type": "timeseries",
                "title": "PVC Usage",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
                "targets": [
                  {"expr": "100 * (kubelet_volume_stats_used_bytes{namespace=~\"database|airflow|monitoring\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"database|airflow|monitoring\"})", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 90}]}}, "overrides": []}
              },
              {
                "id": 9,
                "type": "timeseries",
                "title": "Pod Restarts by Pod",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 22},
                "targets": [
                  {"expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"monitoring|database|airflow\"}[1h]))", "legendFormat": "{{namespace}}/{{pod}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
              },
              {
                "id": 10,
                "type": "timeseries",
                "title": "Workload Ready Pods",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 22},
                "targets": [
                  {"expr": "sum by (namespace) (kube_pod_status_ready{condition=\"true\",namespace=~\"monitoring|database|airflow\"})", "legendFormat": "{{namespace}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
              },
              {
                "id": 11,
                "type": "stat",
                "title": "TimescaleDB Ready",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 8, "x": 0, "y": 30},
                "targets": [
                  {"expr": "max(kube_pod_status_ready{namespace=\"database\",pod=~\"timescaledb.*\",condition=\"true\"})", "legendFormat": "timescaledb"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}
              },
              {
                "id": 12,
                "type": "stat",
                "title": "Airflow Ready Pods",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 8, "x": 8, "y": 30},
                "targets": [
                  {"expr": "sum(kube_pod_status_ready{namespace=\"airflow\",condition=\"true\"})", "legendFormat": "airflow"}
                ],
                "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
              },
              {
                "id": 13,
                "type": "stat",
                "title": "Monitoring Targets Down",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 8, "x": 16, "y": 30},
                "targets": [
                  {"expr": "sum(up{namespace=~\"monitoring|database|airflow\"} == 0)", "legendFormat": "down"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}
              }
            ]
          }
      service-observability:
        json: |
          {
            "uid": "baro-service-observability",
            "title": "Baro Service Observability",
            "tags": ["baro", "service", "gateway", "circuitbreaker"],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "1m",
            "time": {
              "from": "now-6h",
              "to": "now"
            },
            "templating": {
              "list": [
                {
                  "name": "datasource",
                  "type": "datasource",
                  "query": "prometheus",
                  "current": {
                    "text": "Prometheus",
                    "value": "prometheus"
                  }
                }
              ]
            },
            "panels": [
              {
                "id": 1,
                "type": "stat",
                "title": "Gateway Metrics Target Up",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
                "targets": [
                  {"expr": "up{job=\"baro-gateway-service\"}", "legendFormat": "{{instance}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "CircuitBreaker State",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0},
                "targets": [
                  {"expr": "resilience4j_circuitbreaker_state{job=\"baro-gateway-service\"}", "legendFormat": "{{instance}} {{name}} {{state}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "CircuitBreaker Failure Rate",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
                "targets": [
                  {"expr": "resilience4j_circuitbreaker_failure_rate{job=\"baro-gateway-service\"}", "legendFormat": "{{instance}} {{name}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 50}]}}, "overrides": []}
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "CircuitBreaker Slow Call Rate",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
                "targets": [
                  {"expr": "resilience4j_circuitbreaker_slow_call_rate{job=\"baro-gateway-service\"}", "legendFormat": "{{instance}} {{name}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 50}]}}, "overrides": []}
              },
              {
                "id": 5,
                "type": "timeseries",
                "title": "CircuitBreaker Calls",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16},
              "targets": [
                {"expr": "sum by (instance, name, kind) (rate(resilience4j_circuitbreaker_calls_seconds_count{job=\"baro-gateway-service\"}[5m]))", "legendFormat": "{{instance}} {{name}} {{kind}}"}
              ],
              "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
              },
              {
                "id": 6,
                "type": "stat",
                "title": "Service Metrics Targets Up",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 8, "x": 0, "y": 24},
                "targets": [
                  {"expr": "up{job=~\"baro-control-service|baro-dispatch-service\"}", "legendFormat": "{{service}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}
              },
              {
                "id": 7,
                "type": "stat",
                "title": "Vehicle Idle Ratio",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 8, "x": 8, "y": 24},
                "targets": [
                  {"expr": "sum(baro_dispatch_vehicle_status_current{status=\"idle\"}) / sum(baro_dispatch_vehicle_status_current)", "legendFormat": "idle ratio"}
                ],
                "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.8}, {"color": "red", "value": 0.9}]}}, "overrides": []}
              },
              {
                "id": 8,
                "type": "stat",
                "title": "Redis Idle GEO Count",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 6, "w": 8, "x": 16, "y": 24},
                "targets": [
                  {"expr": "baro_dispatch_idle_geo_count", "legendFormat": "idle geo"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}
              },
              {
                "id": 9,
                "type": "bargauge",
                "title": "Vehicle Status Current",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 30},
                "targets": [
                  {"expr": "sum by (status) (baro_dispatch_vehicle_status_current)", "legendFormat": "{{status}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
              },
              {
                "id": 10,
                "type": "timeseries",
                "title": "Telemetry Received Rate",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 30},
                "targets": [
                  {"expr": "sum by (status) (rate(baro_control_telemetry_received_total[5m]))", "legendFormat": "{{status}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
              },
              {
                "id": 11,
                "type": "timeseries",
                "title": "Dispatch Vehicle State Events Rate",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 38},
                "targets": [
                  {"expr": "sum by (status) (rate(baro_dispatch_vehicle_state_events_total[5m]))", "legendFormat": "{{status}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
              },
              {
                "id": 12,
                "type": "timeseries",
                "title": "Redis Idle GEO Saves / Removes",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 38},
                "targets": [
                  {"expr": "sum(rate(baro_dispatch_idle_geo_saves_total[5m]))", "legendFormat": "saves"},
                  {"expr": "sum(rate(baro_dispatch_idle_geo_removes_total[5m]))", "legendFormat": "removes"}
                ],
                "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
              },
              {
                "id": 13,
                "type": "timeseries",
                "title": "Control Pipeline Failures",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 46},
                "targets": [
                  {"expr": "sum(increase(baro_control_telemetry_kafka_publish_failed_total[5m]))", "legendFormat": "kafka publish failed"},
                  {"expr": "sum by (phase) (increase(baro_control_sse_send_failures_total[5m]))", "legendFormat": "sse {{phase}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 20}]}}, "overrides": []}
              },
              {
                "id": 14,
                "type": "timeseries",
                "title": "Dispatch Candidate Not Found",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 46},
                "targets": [
                  {"expr": "sum(increase(baro_dispatch_idle_geo_candidate_not_found_total[5m]))", "legendFormat": "not found"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 5}, {"color": "red", "value": 20}]}}, "overrides": []}
              }
            ]
          }

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: [source, alertname, domain, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: onprem-warning
      routes:
        - matchers:
            - alertname=~"Watchdog|InfoInhibitor"
          receiver: blackhole
        - matchers:
            - source="aws"
          receiver: aws-warning
          routes:
            - matchers:
                - severity="critical"
              receiver: aws-critical
              repeat_interval: 1h
            - matchers:
                - severity="warning"
              receiver: aws-warning
        - matchers:
            - source="service"
          receiver: service-warning
          routes:
            - matchers:
                - severity="critical"
              receiver: service-critical
              repeat_interval: 1h
            - matchers:
                - severity="warning"
              receiver: service-warning
        - matchers:
            - severity="critical"
          receiver: onprem-critical
          repeat_interval: 1h
        - matchers:
            - severity="warning"
          receiver: onprem-warning
    receivers:
      - name: blackhole
      - name: aws-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-aws-slack-webhook/webhook_url
            channel: "#baro-aws-alerts"
            send_resolved: true
            title: "[AWS][CRITICAL] {{ .CommonLabels.alertname }}"
            title_link: "{{ (index .Alerts 0).GeneratorURL }}"
            text: |-
              {{ range .Alerts }}• 상태: {{ .Status }}
              • 발생시각(UTC): {{ .StartsAt }}
              • 설명: {{ .Annotations.description }}
              {{ end }}
      - name: aws-warning
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-aws-slack-webhook/webhook_url
            channel: "#baro-aws-alerts"
            send_resolved: true
            title: "[AWS][WARNING] {{ .CommonLabels.alertname }}"
            title_link: "{{ (index .Alerts 0).GeneratorURL }}"
            text: |-
              {{ range .Alerts }}• 상태: {{ .Status }}
              • 발생시각(UTC): {{ .StartsAt }}
              • 설명: {{ .Annotations.description }}
              {{ end }}
      - name: onprem-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook_url
            channel: "#baro-onprem-alerts"
            send_resolved: true
            title: "[ONPREM][CRITICAL] {{ .CommonLabels.alertname }}"
            title_link: "{{ (index .Alerts 0).GeneratorURL }}"
            text: |-
              {{ range .Alerts }}• 상태: {{ .Status }}
              • 발생시각(UTC): {{ .StartsAt }}
              • 설명: {{ .Annotations.description }}
              {{ end }}
      - name: onprem-warning
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook_url
            channel: "#baro-onprem-alerts"
            send_resolved: true
            title: "[ONPREM][WARNING] {{ .CommonLabels.alertname }}"
            title_link: "{{ (index .Alerts 0).GeneratorURL }}"
            text: |-
              {{ range .Alerts }}• 상태: {{ .Status }}
              • 발생시각(UTC): {{ .StartsAt }}
              • 설명: {{ .Annotations.description }}
              {{ end }}
      - name: service-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-service-slack-webhook/webhook_url
            channel: "#baro-service-alert"
            send_resolved: true
            title: "[SERVICE][CRITICAL] {{ .CommonLabels.alertname }}"
            title_link: "{{ (index .Alerts 0).GeneratorURL }}"
            text: |-
              {{ range .Alerts }}• 상태: {{ .Status }}
              • 발생시각(UTC): {{ .StartsAt }}
              • 설명: {{ .Annotations.description }}
              {{ end }}
      - name: service-warning
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-service-slack-webhook/webhook_url
            channel: "#baro-service-alert"
            send_resolved: true
            title: "[SERVICE][WARNING] {{ .CommonLabels.alertname }}"
            title_link: "{{ (index .Alerts 0).GeneratorURL }}"
            text: |-
              {{ range .Alerts }}• 상태: {{ .Status }}
              • 발생시각(UTC): {{ .StartsAt }}
              • 설명: {{ .Annotations.description }}
              {{ end }}
  alertmanagerSpec:
    nodeSelector:
      role: monitoring
    secrets:
      - alertmanager-slack-webhook
      - alertmanager-aws-slack-webhook
      - alertmanager-service-slack-webhook

additionalPrometheusRulesMap:
  baro-dev-aws-observability:
    groups:
      - name: baro.dev.aws.alb
        rules:
          - alert: BaroAlbTarget5xxHigh
            expr: sum by (load_balancer) (aws_applicationelb_httpcode_target_5_xx_count_sum) >= 10
            for: 10m
            labels:
              source: aws
              severity: critical
              domain: gateway
            annotations:
              summary: "ALB target 5xx count is high"
              description: "ALB target 5xx가 10분 이상 10건 이상 발생했습니다. load_balancer={{ $labels.load_balancer }}"
          - alert: BaroAlbTargetResponseTimeHigh
            expr: avg by (load_balancer) (aws_applicationelb_target_response_time_average) > 2
            for: 10m
            labels:
              source: aws
              severity: warning
              domain: gateway
            annotations:
              summary: "ALB target response time is high"
              description: "ALB target 평균 응답 시간이 10분 이상 2초를 초과했습니다. load_balancer={{ $labels.load_balancer }}"

      - name: baro.dev.aws.ecs
        rules:
          - alert: BaroEcsCpuHigh
            expr: avg by (cluster_name, service_name) (aws_ecs_cpuutilization_average) > 80
            for: 10m
            labels:
              source: aws
              severity: warning
              domain: ecs
            annotations:
              summary: "ECS service CPU is high"
              description: "ECS 서비스 CPU 사용률이 10분 이상 80%를 초과했습니다. cluster={{ $labels.cluster_name }}, service={{ $labels.service_name }}"
          - alert: BaroEcsMemoryHigh
            expr: avg by (cluster_name, service_name) (aws_ecs_memory_utilization_average) > 85
            for: 10m
            labels:
              source: aws
              severity: warning
              domain: ecs
            annotations:
              summary: "ECS service memory is high"
              description: "ECS 서비스 메모리 사용률이 10분 이상 85%를 초과했습니다. cluster={{ $labels.cluster_name }}, service={{ $labels.service_name }}"

      - name: baro.dev.aws.rds
        rules:
          - alert: BaroRdsCpuHigh
            expr: avg by (dbinstance_identifier) (aws_rds_cpuutilization_average) > 80
            for: 15m
            labels:
              source: aws
              severity: warning
              domain: rds
            annotations:
              summary: "RDS CPU is high"
              description: "RDS CPU 사용률이 15분 이상 80%를 초과했습니다. db={{ $labels.dbinstance_identifier }}"
          - alert: BaroRdsFreeStorageLow
            expr: avg by (dbinstance_identifier) (aws_rds_free_storage_space_average) < 10737418240
            for: 15m
            labels:
              source: aws
              severity: critical
              domain: rds
            annotations:
              summary: "RDS free storage is low"
              description: "RDS 여유 스토리지가 15분 이상 10GiB 미만입니다. db={{ $labels.dbinstance_identifier }}"
          - alert: BaroRdsConnectionsHigh
            expr: avg by (dbinstance_identifier) (aws_rds_database_connections_average) > 80
            for: 15m
            labels:
              source: aws
              severity: warning
              domain: rds
            annotations:
              summary: "RDS database connections are high"
              description: "RDS 연결 수가 15분 이상 80개를 초과했습니다. db={{ $labels.dbinstance_identifier }}"

      - name: baro.dev.aws.elasticache
        rules:
          - alert: BaroRedisCpuHigh
            expr: avg by (cache_cluster_id) (aws_elasticache_cpuutilization_average) > 80
            for: 10m
            labels:
              source: aws
              severity: warning
              domain: redis
            annotations:
              summary: "ElastiCache CPU is high"
              description: "ElastiCache CPU 사용률이 10분 이상 80%를 초과했습니다. cluster={{ $labels.cache_cluster_id }}"
          - alert: BaroRedisMemoryHigh
            expr: avg by (cache_cluster_id) (aws_elasticache_database_memory_usage_percentage_average) > 85
            for: 10m
            labels:
              source: aws
              severity: warning
              domain: redis
            annotations:
              summary: "ElastiCache memory usage is high"
              description: "ElastiCache 메모리 사용률이 10분 이상 85%를 초과했습니다. cluster={{ $labels.cache_cluster_id }}"
          - alert: BaroRedisEvictionsDetected
            expr: sum by (cache_cluster_id) (aws_elasticache_evictions_sum) > 0
            for: 5m
            labels:
              source: aws
              severity: critical
              domain: redis
            annotations:
              summary: "ElastiCache evictions detected"
              description: "ElastiCache eviction이 발생했습니다. cluster={{ $labels.cache_cluster_id }}"

      - name: baro.dev.aws.ec2
        rules:
          - alert: BaroEc2StatusCheckFailed
            expr: max by (instance_id) (aws_ec2_status_check_failed_instance_maximum) > 0 or max by (instance_id) (aws_ec2_status_check_failed_system_maximum) > 0
            for: 5m
            labels:
              source: aws
              severity: critical
              domain: ec2
            annotations:
              summary: "EC2 status check failed"
              description: "EC2 status check가 5분 이상 실패했습니다. instance={{ $labels.instance_id }}"
          - alert: BaroEc2CpuHigh
            expr: avg by (instance_id) (aws_ec2_cpuutilization_average) > 85
            for: 15m
            labels:
              source: aws
              severity: warning
              domain: ec2
            annotations:
              summary: "EC2 CPU is high"
              description: "EC2 CPU 사용률이 15분 이상 85%를 초과했습니다. instance={{ $labels.instance_id }}"
          - alert: BaroEc2NodeExporterDown
            expr: up{job="baro-ec2-node-exporter"} == 0
            for: 5m
            labels:
              source: aws
              severity: critical
              domain: ec2
            annotations:
              summary: "EC2 node-exporter is down"
              description: "EC2 node-exporter scrape가 5분 이상 실패했습니다. role={{ $labels.ec2_role }}, target={{ $labels.instance }}"
          - alert: BaroEc2FilesystemUsageHigh
            expr: 100 * (1 - (node_filesystem_avail_bytes{job="baro-ec2-node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs",mountpoint!~"/dev.*|/proc.*|/run.*|/sys.*"} / node_filesystem_size_bytes{job="baro-ec2-node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs",mountpoint!~"/dev.*|/proc.*|/run.*|/sys.*"})) > 80
            for: 10m
            labels:
              source: aws
              severity: warning
              domain: ec2
            annotations:
              summary: "EC2 filesystem usage is high"
              description: "EC2 filesystem 사용률이 10분 이상 80%를 초과했습니다. role={{ $labels.ec2_role }}, mount={{ $labels.mountpoint }}, usage={{ $value }}%"
          - alert: BaroEc2FilesystemUsageCritical
            expr: 100 * (1 - (node_filesystem_avail_bytes{job="baro-ec2-node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs",mountpoint!~"/dev.*|/proc.*|/run.*|/sys.*"} / node_filesystem_size_bytes{job="baro-ec2-node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs",mountpoint!~"/dev.*|/proc.*|/run.*|/sys.*"})) > 90
            for: 5m
            labels:
              source: aws
              severity: critical
              domain: ec2
            annotations:
              summary: "EC2 filesystem usage is critical"
              description: "EC2 filesystem 사용률이 5분 이상 90%를 초과했습니다. role={{ $labels.ec2_role }}, mount={{ $labels.mountpoint }}, usage={{ $value }}%"

  baro-dev-service-observability:
    groups:
      - name: baro.dev.service.gateway
        rules:
          - alert: BaroGatewayMetricsTargetDown
            expr: up{job="baro-gateway-service"} == 0
            for: 3m
            labels:
              source: service
              severity: critical
              domain: gateway
              service: gateway-service
            annotations:
              summary: "gateway-service metrics target is down"
              description: "gateway-service /actuator/prometheus scrape가 3분 이상 실패했습니다. target={{ $labels.instance }}"
          - alert: BaroGatewayCircuitBreakerOpen
            expr: resilience4j_circuitbreaker_state{job="baro-gateway-service", state="open"} == 1
            for: 1m
            labels:
              source: service
              severity: critical
              domain: gateway
              service: gateway-service
            annotations:
              summary: "Gateway circuit breaker is open"
              description: "Gateway CircuitBreaker가 1분 이상 OPEN 상태입니다. instance={{ $labels.instance }}, circuit_breaker={{ $labels.name }}"
          - alert: BaroGatewayCircuitBreakerHalfOpen
            expr: resilience4j_circuitbreaker_state{job="baro-gateway-service", state="half_open"} == 1
            for: 5m
            labels:
              source: service
              severity: warning
              domain: gateway
              service: gateway-service
            annotations:
              summary: "Gateway circuit breaker is half-open"
              description: "Gateway CircuitBreaker가 5분 이상 HALF_OPEN 상태입니다. instance={{ $labels.instance }}, circuit_breaker={{ $labels.name }}"
          - alert: BaroGatewayCircuitBreakerFailureRateHigh
            expr: resilience4j_circuitbreaker_failure_rate{job="baro-gateway-service"} >= 50
            for: 5m
            labels:
              source: service
              severity: warning
              domain: gateway
              service: gateway-service
            annotations:
              summary: "Gateway circuit breaker failure rate is high"
              description: "Gateway CircuitBreaker 실패율이 5분 이상 50% 이상입니다. instance={{ $labels.instance }}, circuit_breaker={{ $labels.name }}"
          - alert: BaroGatewayCircuitBreakerSlowCallRateHigh
            expr: resilience4j_circuitbreaker_slow_call_rate{job="baro-gateway-service"} >= 50
            for: 5m
            labels:
              source: service
              severity: warning
              domain: gateway
              service: gateway-service
            annotations:
              summary: "Gateway circuit breaker slow call rate is high"
              description: "Gateway CircuitBreaker slow call 비율이 5분 이상 50% 이상입니다. instance={{ $labels.instance }}, circuit_breaker={{ $labels.name }}"

      - name: baro.dev.service.pipeline
        rules:
          - alert: BaroControlMetricsTargetDown
            expr: up{job="baro-control-service"} == 0
            for: 3m
            labels:
              source: service
              severity: critical
              domain: telemetry
              service: control-service
            annotations:
              summary: "control-service metrics target is down"
              description: "control-service /actuator/prometheus scrape가 3분 이상 실패했습니다. target={{ $labels.instance }}"
          - alert: BaroDispatchMetricsTargetDown
            expr: up{job="baro-dispatch-service"} == 0
            for: 3m
            labels:
              source: service
              severity: critical
              domain: dispatch
              service: dispatch-service
            annotations:
              summary: "dispatch-service metrics target is down"
              description: "dispatch-service /actuator/prometheus scrape가 3분 이상 실패했습니다. target={{ $labels.instance }}"
          - alert: BaroTelemetryKafkaPublishFailures
            expr: increase(baro_control_telemetry_kafka_publish_failed_total[5m]) > 0
            for: 1m
            labels:
              source: service
              severity: warning
              domain: telemetry
              service: control-service
            annotations:
              summary: "Telemetry Kafka publish failures detected"
              description: "control-service Kafka publish 실패가 감지되었습니다. failures_5m={{ $value }}"
          - alert: BaroControlSseSendFailuresHigh
            expr: increase(baro_control_sse_send_failures_total[5m]) > 20
            for: 5m
            labels:
              source: service
              severity: warning
              domain: telemetry
              service: control-service
            annotations:
              summary: "SSE send failures are high"
              description: "control-service SSE send 실패가 5분 동안 20건을 초과했습니다. phase={{ $labels.phase }}, failures_5m={{ $value }}"

      - name: baro.dev.service.fleet
        rules:
          - alert: BaroVehicleIdleRatioHigh
            expr: sum(baro_dispatch_vehicle_status_current{status="idle"}) / sum(baro_dispatch_vehicle_status_current) > 0.9
            for: 5m
            labels:
              source: service
              severity: warning
              domain: fleet
              service: dispatch-service
            annotations:
              summary: "Vehicle idle ratio is high"
              description: "차량 IDLE 비율이 5분 이상 90%를 초과했습니다. ratio={{ $value }}"
          - alert: BaroVehicleActiveFleetLow
            expr: (sum(baro_dispatch_vehicle_status_current{status=~"driving|moving_to_pickup|relocating"}) or vector(0)) < 10 and sum(baro_dispatch_vehicle_status_current) > 100
            for: 5m
            labels:
              source: service
              severity: warning
              domain: fleet
              service: dispatch-service
            annotations:
              summary: "Active vehicle count is low"
              description: "전체 차량이 100대 이상인데 운행/이동/재배치 차량이 10대 미만입니다. active={{ $value }}"
          - alert: BaroDispatchIdleGeoSavesSpike
            expr: increase(baro_dispatch_idle_geo_saves_total[5m]) > 500
            for: 1m
            labels:
              source: service
              severity: warning
              domain: dispatch
              service: dispatch-service
            annotations:
              summary: "Dispatch idle GEO saves spiked"
              description: "5분 동안 Redis idle GEO 저장이 500건을 초과했습니다. saves_5m={{ $value }}"
          - alert: BaroDispatchIdleGeoEmpty
            expr: baro_dispatch_idle_geo_count == 0
            for: 5m
            labels:
              source: service
              severity: warning
              domain: dispatch
              service: dispatch-service
            annotations:
              summary: "Dispatch idle GEO pool is empty"
              description: "Redis idle GEO pool이 5분 이상 비어 있습니다. 배차 후보 탐색 실패 가능성이 있습니다."
          - alert: BaroDispatchCandidateNotFoundHigh
            expr: increase(baro_dispatch_idle_geo_candidate_not_found_total[5m]) > 20
            for: 5m
            labels:
              source: service
              severity: warning
              domain: dispatch
              service: dispatch-service
            annotations:
              summary: "Dispatch candidate not found is high"
              description: "5분 동안 배차 후보 없음이 20건을 초과했습니다. count_5m={{ $value }}"

prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    externalUrl: ${prometheus_external_url}
    additionalScrapeConfigs:
      - job_name: baro-gateway-service
        scheme: ${gateway_metrics_scheme}
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
%{ for target in gateway_metrics_targets ~}
              - ${target}
%{ endfor ~}
            labels:
              source: service
              service: gateway-service
      - job_name: baro-control-service
        scheme: ${control_metrics_scheme}
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
%{ for target in control_metrics_targets ~}
              - ${target}
%{ endfor ~}
            labels:
              source: service
              service: control-service
      - job_name: baro-dispatch-service
        scheme: ${dispatch_metrics_scheme}
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
%{ for target in dispatch_metrics_targets ~}
              - ${target}
%{ endfor ~}
            labels:
              source: service
              service: dispatch-service
      - job_name: baro-ec2-node-exporter
        static_configs:
%{ for target in ec2_node_exporter_targets ~}
          - targets:
              - ${target.target}
            labels:
              source: aws
              domain: ec2
              ec2_role: ${target.role}
%{ endfor ~}
      - job_name: baro-kafka-jmx-exporter
        static_configs:
          - targets:
%{ for target in kafka_jmx_exporter_targets ~}
              - ${target}
%{ endfor ~}
            labels:
              source: aws
              domain: kafka
              ec2_role: kafka
    nodeSelector:
      role: monitoring
    resources:
      limits:
        memory: 1Gi
      requests:
        memory: 512Mi
    retention: 7d

kube-state-metrics:
  nodeSelector:
    role: monitoring

prometheus-node-exporter:
  tolerations:
    - effect: NoSchedule
      operator: Exists
