grafana:
  dashboards:
    baro:
      kafka-load-test:
        json: |
          {
            "uid": "baro-kafka-load-test",
            "title": "Baro Kafka Load Test",
            "tags": ["baro", "kafka", "load-test", "dev"],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "15s",
            "time": {"from": "now-1h", "to": "now"},
            "templating": {
              "list": [
                {
                  "name": "datasource",
                  "type": "datasource",
                  "query": "prometheus",
                  "current": {"text": "Prometheus", "value": "prometheus"}
                },
                {
                  "name": "topic",
                  "type": "query",
                  "datasource": {"type": "prometheus", "uid": "$datasource"},
                  "definition": "label_values(kafka_consumergroup_lag, topic)",
                  "query": "label_values(kafka_consumergroup_lag, topic)",
                  "current": {"text": "vehicle-data-topic", "value": "vehicle-data-topic"}
                },
                {
                  "name": "consumergroup",
                  "type": "query",
                  "datasource": {"type": "prometheus", "uid": "$datasource"},
                  "definition": "label_values(kafka_consumergroup_lag{topic=\"$topic\"}, consumergroup)",
                  "query": "label_values(kafka_consumergroup_lag{topic=\"$topic\"}, consumergroup)",
                  "current": {"text": "dispatch-service", "value": "dispatch-service"}
                }
              ]
            },
            "panels": [
              {
                "id": 1,
                "type": "timeseries",
                "title": "Kafka Messages In / sec",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
                "targets": [
                  {"expr": "sum by (topic) (rate(kafka_server_brokertopicmetrics_messagesinpersec_total{job=\"baro-kafka-jmx-exporter\",topic!=\"__consumer_offsets\"}[2m]))", "legendFormat": "{{topic}} messages/s"}
                ],
                "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "Kafka Bytes In / sec",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
                "targets": [
                  {"expr": "sum by (topic) (rate(kafka_server_brokertopicmetrics_bytesinpersec_total{job=\"baro-kafka-jmx-exporter\",topic!=\"__consumer_offsets\"}[2m]))", "legendFormat": "{{topic}} bytes/s"}
                ],
                "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []}
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "Dispatch Consumer Lag Total",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
                "targets": [
                  {"expr": "sum(kafka_consumergroup_lag{topic=\"$topic\",consumergroup=\"$consumergroup\"})", "legendFormat": "$consumergroup lag"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1000}, {"color": "red", "value": 10000}]}}, "overrides": []}
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "Dispatch Consumer Lag by Partition",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
                "targets": [
                  {"expr": "kafka_consumergroup_lag{topic=\"$topic\",consumergroup=\"$consumergroup\"}", "legendFormat": "partition {{partition}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
              },
              {
                "id": 5,
                "type": "timeseries",
                "title": "Kafka EC2 CPU / Disk Usage",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
                "targets": [
                  {"expr": "100 * (1 - avg(rate(node_cpu_seconds_total{job=\"baro-ec2-node-exporter\",ec2_role=\"kafka\",mode=\"idle\"}[1m])))", "legendFormat": "node cpu"},
                  {"expr": "100 * (1 - (node_filesystem_avail_bytes{job=\"baro-ec2-node-exporter\",ec2_role=\"kafka\",fstype!~\"tmpfs|overlay|squashfs|ramfs|nsfs\",mountpoint!~\"/dev.*|/proc.*|/run.*|/sys.*\"} / node_filesystem_size_bytes{job=\"baro-ec2-node-exporter\",ec2_role=\"kafka\",fstype!~\"tmpfs|overlay|squashfs|ramfs|nsfs\",mountpoint!~\"/dev.*|/proc.*|/run.*|/sys.*\"}))", "legendFormat": "disk {{mountpoint}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}
              },
              {
                "id": 6,
                "type": "timeseries",
                "title": "Kafka EC2 Network",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
                "targets": [
                  {"expr": "sum(rate(node_network_receive_bytes_total{job=\"baro-ec2-node-exporter\",ec2_role=\"kafka\",device!~\"lo|docker.*|veth.*|br.*\"}[1m]))", "legendFormat": "rx"},
                  {"expr": "sum(rate(node_network_transmit_bytes_total{job=\"baro-ec2-node-exporter\",ec2_role=\"kafka\",device!~\"lo|docker.*|veth.*|br.*\"}[1m]))", "legendFormat": "tx"}
                ],
                "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []}
              },
              {
                "id": 7,
                "type": "timeseries",
                "title": "Dispatch Service CPU / Memory",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
                "targets": [
                  {"expr": "avg(aws_ecs_cpuutilization_average{service_name=~\".*dispatch.*\"})", "legendFormat": "dispatch cpu"},
                  {"expr": "avg(aws_ecs_memory_utilization_average{service_name=~\".*dispatch.*\"})", "legendFormat": "dispatch memory"}
                ],
                "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}
              },
              {
                "id": 8,
                "type": "timeseries",
                "title": "Scrape Health",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
                "targets": [
                  {"expr": "up{job=~\"baro-kafka-jmx-exporter|baro-ec2-node-exporter|kafka-exporter.*\"}", "legendFormat": "{{job}} {{instance}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}
              },
              {
                "id": 9,
                "type": "timeseries",
                "title": "Dispatch Kafka Listener Throughput",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
                "targets": [
                  {"expr": "sum by (name) (rate(spring_kafka_listener_seconds_count{job=\"baro-dispatch-service\",result=\"success\"}[1m]))", "legendFormat": "{{name}} records/s"}
                ],
                "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
              },
              {
                "id": 10,
                "type": "timeseries",
                "title": "Dispatch Kafka Listener Avg Processing Time",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
                "targets": [
                  {"expr": "sum by (name) (rate(spring_kafka_listener_seconds_sum{job=\"baro-dispatch-service\",result=\"success\"}[1m])) / sum by (name) (rate(spring_kafka_listener_seconds_count{job=\"baro-dispatch-service\",result=\"success\"}[1m]))", "legendFormat": "{{name}} avg"}
                ],
                "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
              },
              {
                "id": 11,
                "type": "timeseries",
                "title": "Dispatch Kafka Listener Errors",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 40},
                "targets": [
                  {"expr": "sum by (name, exception) (rate(spring_kafka_listener_seconds_count{job=\"baro-dispatch-service\",exception!=\"none\"}[1m]))", "legendFormat": "{{name}} {{exception}}"}
                ],
                "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
              },
              {
                "id": 12,
                "type": "timeseries",
                "title": "Dispatch Redis Command Avg Latency",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 40},
                "targets": [
                  {"expr": "sum by (command) (rate(lettuce_command_completion_seconds_sum{job=\"baro-dispatch-service\"}[1m])) / sum by (command) (rate(lettuce_command_completion_seconds_count{job=\"baro-dispatch-service\"}[1m]))", "legendFormat": "{{command}} avg"}
                ],
                "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
              },
              {
                "id": 13,
                "type": "timeseries",
                "title": "Dispatch Redis Command Rate",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 48},
                "targets": [
                  {"expr": "sum by (command) (rate(lettuce_command_completion_seconds_count{job=\"baro-dispatch-service\"}[1m]))", "legendFormat": "{{command}} ops/s"}
                ],
                "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
              },
              {
                "id": 14,
                "type": "timeseries",
                "title": "Dispatch DB Pool Pressure",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 48},
                "targets": [
                  {"expr": "hikaricp_connections_active{job=\"baro-dispatch-service\"}", "legendFormat": "active"},
                  {"expr": "hikaricp_connections_pending{job=\"baro-dispatch-service\"}", "legendFormat": "pending"},
                  {"expr": "hikaricp_connections_max{job=\"baro-dispatch-service\"}", "legendFormat": "max"}
                ],
                "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
              },
              {
                "id": 15,
                "type": "timeseries",
                "title": "Dispatch JVM GC Pause",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 56},
                "targets": [
                  {"expr": "sum(rate(jvm_gc_pause_seconds_sum{job=\"baro-dispatch-service\"}[1m]))", "legendFormat": "gc pause seconds/s"},
                  {"expr": "max(jvm_gc_pause_seconds_max{job=\"baro-dispatch-service\"})", "legendFormat": "gc pause max"}
                ],
                "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
              },
              {
                "id": 16,
                "type": "timeseries",
                "title": "Dispatch HTTP Request Latency",
                "datasource": {"type": "prometheus", "uid": "$datasource"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 56},
                "targets": [
                  {"expr": "sum by (uri) (rate(http_server_requests_seconds_sum{job=\"baro-dispatch-service\"}[1m])) / sum by (uri) (rate(http_server_requests_seconds_count{job=\"baro-dispatch-service\"}[1m]))", "legendFormat": "{{uri}} avg"}
                ],
                "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
              }
            ]
          }
