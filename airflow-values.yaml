# values 파일
cat <<'EOF' > ~/helm-values/airflow-values.yaml
# === Executor 설정 ===
executor: "KubernetesExecutor"

# === 내장 PostgreSQL 비활성화 ===
postgresql:
  enabled: false

# === 외부 DB 연결 (TimescaleDB) ===
data:
  metadataConnection:
    user: postgres
    pass: baro123
    protocol: postgresql
    host: timescaledb.database.svc.cluster.local
    port: 5432
    db: airflow_metadata

# === Webserver 설정 ===
webserver:
  service:
    type: NodePort
    ports:
      - name: airflow-ui
        port: 8080
        targetPort: 8080
        nodePort: 30800
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-2

# === Scheduler 설정 ===
scheduler:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-2

# === Triggerer 설정 ===
triggerer:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-2

# === 불필요한 컴포넌트 비활성화 ===
redis:
  enabled: false

flower:
  enabled: false

statsd:
  enabled: false

# === DAG 저장소 ===
dags:
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: local-path

# === 로그 저장소 ===
logs:
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: local-path
EOF